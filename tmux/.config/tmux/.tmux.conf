################################
# General
################################

set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g xterm-keys on
set -g mouse on

# Fix colors and improve escape time (important for vim/neovim)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,xterm-kitty:RGB"
set -s escape-time 10
set -g focus-events on
set -g display-time 2000
set -g detach-on-destroy off

# Visual activity monitoring
setw -g monitor-activity on
set -g visual-activity on

################################
# Prefix: Ctrl + a
################################

unbind C-b
set -g prefix C-a
bind -N "Send Ctrl+a to the app" C-a send-prefix

################################
# Reload config
################################

unbind r
bind -N "Reload tmux config" r source-file ~/.tmux.conf \; display 'Reloaded tmux config.'

################################
# Session / window / pane management
################################

# New session
unbind n
unbind C-n
bind-key -N "New session" n new-session
bind-key -N "New session" C-n new-session

# New window
unbind t
unbind C-t
bind-key -N "New window" t new-window
bind-key -N "New window" C-t new-window

# Kill pane / session
unbind w
unbind C-w
bind-key -N "Kill pane" w kill-pane
bind-key -N "Kill pane" C-w kill-pane

unbind q
unbind C-q
bind-key -N "Kill session" q kill-session
bind-key -N "Kill session" C-q kill-session

# Splits: g = vertical (side by side), h = horizontal (top/bottom)
unbind g
unbind C-g
bind-key -N "Split side by side" g split-window -h -c "#{pane_current_path}"
bind-key -N "Split side by side" C-g split-window -h -c "#{pane_current_path}"

unbind h
unbind C-h
bind-key -N "Split top / bottom" h split-window -v -c "#{pane_current_path}"
bind-key -N "Split top / bottom" C-h split-window -v -c "#{pane_current_path}"

# Window navigation
unbind Pagedown
unbind Pageup
bind-key -N "Next window" Pagedown next-window
bind-key -N "Previous window" Pageup previous-window

# Detach / paste
bind-key -N "Detach (hide a popup: timer/scratch keep running)" C-d detach-client
bind-key -N "Paste tmux buffer" C-p paste-buffer

# Redraw client
bind -N "Redraw the screen" R refresh-client

# Dev layout (pass current pane path so the layout opens in the right dir)
bind -n -N "Full dev layout (nvim + shell + Claude) in this folder" M-n run-shell "bash ~/.config/tmux_workspaces/dev_claude.sh '#{pane_current_path}'"

################################
# Pane navigation
################################

# Alt+h/j/k/l and Alt+arrows (no prefix) — seamless with nvim splits via
# vim-tmux-navigator: inside nvim the key is passed through, nvim moves between
# its splits and hands off to tmux at the edge. Alt (not Ctrl) keeps Ctrl+L/K/J
# working in shells and Claude.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n -N "Pane left (nvim splits too)" M-h     if-shell "$is_vim" 'send-keys M-h'     'select-pane -L'
bind -n -N "Pane down (nvim splits too)" M-j     if-shell "$is_vim" 'send-keys M-j'     'select-pane -D'
bind -n -N "Pane up (nvim splits too)" M-k     if-shell "$is_vim" 'send-keys M-k'     'select-pane -U'
bind -n -N "Pane right (nvim splits too)" M-l     if-shell "$is_vim" 'send-keys M-l'     'select-pane -R'
bind -n -N "Pane left (nvim splits too)" M-Left  if-shell "$is_vim" 'send-keys M-Left'  'select-pane -L'
bind -n -N "Pane down (nvim splits too)" M-Down  if-shell "$is_vim" 'send-keys M-Down'  'select-pane -D'
bind -n -N "Pane up (nvim splits too)" M-Up    if-shell "$is_vim" 'send-keys M-Up'    'select-pane -U'
bind -n -N "Pane right (nvim splits too)" M-Right if-shell "$is_vim" 'send-keys M-Right' 'select-pane -R'
bind -T copy-mode-vi M-h select-pane -L
bind -T copy-mode-vi M-j select-pane -D
bind -T copy-mode-vi M-k select-pane -U
bind -T copy-mode-vi M-l select-pane -R

# Pane navigation (prefix + jk for vertical, Left/Right for horizontal)
# Note: h is bound to horizontal split, so j/k/Left/Right are used here
bind-key -N "Pane down" j select-pane -D
bind-key -N "Pane up" k select-pane -U
bind-key -N "Pane left" Left  select-pane -L
bind-key -N "Pane right" Right select-pane -R

# Pane resizing (prefix + HJKL, repeatable)
bind -r -N "Resize pane down (repeat)" J resize-pane -D 5
bind -r -N "Resize pane up (repeat)" K resize-pane -U 5
bind -r -N "Resize pane left (repeat)" H resize-pane -L 5
bind -r -N "Resize pane right (repeat)" L resize-pane -R 5

################################
# Copy mode (vi keys)
################################

setw -g mode-keys vi
bind -N "Copy mode (scroll back, v select, y copy)" Enter copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y              send -X copy-pipe-and-cancel "DISPLAY=\${DISPLAY:-:0} xclip -in -selection clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "DISPLAY=\${DISPLAY:-:0} xclip -in -selection clipboard"
bind -T copy-mode-vi H   send -X start-of-line
bind -T copy-mode-vi L   send -X end-of-line

# Apps inside tmux (Claude Code, nvim) copy via OSC 52. gnome-terminal ignores
# OSC 52, so tmux accepts it and the hook forwards the buffer to the X clipboard.
set -g set-clipboard on
set-hook -g pane-set-clipboard 'run-shell -b "tmux save-buffer - | DISPLAY=\${DISPLAY:-:0} xclip -in -selection clipboard >/dev/null 2>&1"'

################################
# Status bar
################################

set -g status-position bottom
set -g status-interval 15            # clock only; pom pushes @pom itself
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa] "

set -g status-right-length 60
set -g status-right "#{@pom}#[fg=#a6e3a1] %Y-%m-%d #[fg=#cdd6f4]%H:%M "

set -g window-status-format         " #I:#W "
set -g window-status-current-format "#[bg=#313244,fg=#cdd6f4,bold] #I:#W#{?window_zoomed_flag,[Z],} "

set -g pane-border-style        "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

################################
# My tools — all on Alt, no prefix
################################
# Rule: prefix = tmux itself (sessions, windows, panes); Alt = my own tools.
# Avoided: Alt+f/b/d/. (bash word keys), Alt+Shift (keyboard layout toggle).
#   Alt+t scratch   Alt+g lazygit   Alt+o open file (fzf)   Alt+e vifm
#   Alt+v VimCommander   Alt+r run_*.sh   Alt+s serial   Alt+w pomodoro
#   Alt+n dev layout     Alt+/ cheat sheet

bind-key -n -N "Scratch shell popup" M-t display-popup -E "tmux new-session -A -s scratch \\; set-option -t scratch detach-on-destroy on"

# Quick tools in popups, opened in the current pane's directory
bind-key -n -N "lazygit popup" M-g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind-key -n -N "Fuzzy-pick a file and edit it" M-o display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "bash ~/.config/tmux/scripts/pick-edit.sh"
bind-key -n -N "vifm popup" M-e display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "vifm ."
# VimCommander (GUI) at the current pane's directory
bind-key -n -N "VimCommander in this folder" M-v run-shell -b "~/.local/bin/vimcommander '#{pane_current_path}' >/dev/null 2>&1"

# Project run_*.sh scripts (build / flash / openocd / tests …), run in the
# window's shell pane so the output stays visible (and readable by Claude).
# The last script run in a project is listed first: Alt+r Enter = run it again.
bind-key -n -N "Run a project run_*.sh script" M-r display-popup -E -w 70% -h 60% "bash ~/.config/tmux/scripts/run-script.sh '#{window_id}' '#{pane_current_path}' '#{session_path}'"

# serial monitor: pick a /dev/ttyUSB*|ttyACM* port → picocom in a new
#        window (Enter 115200, Ctrl+b other baud; quit picocom: Ctrl+b Ctrl+x)
bind-key -n -N "Serial monitor (pick a port, picocom)" M-s display-popup -E -w 70% -h 40% "bash ~/.config/tmux/scripts/serial.sh '#{pane_current_path}'"

################################
# Phone (iSH over SSH)
################################

# prefix + m  menu with one-key items — everything the Alt keys do, for a
#             keyboard without Alt (iPhone); popups take the whole screen
bind-key -N "Phone menu (everything the Alt keys do)" m display-menu -T "#[align=centre] dev " -x C -y C \
  "Zoom pane"        z "resize-pane -Z" \
  "lazygit"          g "display-popup -E -w 100% -h 100% -d '#{pane_current_path}' lazygit" \
  "Run script…"      r "display-popup -E -w 100% -h 100% \"bash ~/.config/tmux/scripts/run-script.sh '#{window_id}' '#{pane_current_path}' '#{session_path}'\"" \
  "Open file…"       o "display-popup -E -w 100% -h 100% -d '#{pane_current_path}' \"bash ~/.config/tmux/scripts/pick-edit.sh\"" \
  "vifm"             e "display-popup -E -w 100% -h 100% -d '#{pane_current_path}' \"vifm .\"" \
  "Serial monitor…"  s "display-popup -E -w 100% -h 100% \"bash ~/.config/tmux/scripts/serial.sh '#{pane_current_path}'\"" \
  "" \
  "Switch session…"  o "choose-tree -Zs" \
  "Next window"      n "next-window" \
  "Pomodoro"         w "display-popup -E -w 64 -h 24 \"tmux new-session -A -s pom 'python3 ~/.config/tmux_workspaces/pom.py'\"" \
  "Key cheat sheet"  / "display-popup -E -w 100% -h 100% ~/.local/bin/keys --tmux" \
  "Scratch shell"    t "display-popup -E -w 100% -h 100% \"tmux new-session -A -s scratch \\\\; set-option -t scratch detach-on-destroy on\"" \
  "Detach"           d "detach-client"

# Zoom the Claude pane while the phone is looking, unzoom when it's gone
set-hook -g client-attached[42]        'run-shell -b "bash ~/.config/tmux/scripts/phone-zoom.sh"'
set-hook -g client-detached[42]        'run-shell -b "bash ~/.config/tmux/scripts/phone-zoom.sh"'
set-hook -g client-session-changed[42] 'run-shell -b "bash ~/.config/tmux/scripts/phone-zoom.sh"'
set-hook -g client-resized[42]         'run-shell -b "bash ~/.config/tmux/scripts/phone-zoom.sh"'
set-hook -g session-window-changed[42] 'run-shell -b "bash ~/.config/tmux/scripts/phone-zoom.sh"'

# Pomodoro popup: one global timer (session "pom"), shown in status-right.
# Hide the popup with prefix C-d — the timer keeps running; q inside pom quits it.
bind-key -n -N "Pomodoro timer" M-w display-popup -E -w 64 -h 24 "tmux new-session -A -s pom 'python3 ~/.config/tmux_workspaces/pom.py'"

# searchable cheat sheet of tmux + i3 keys, with how often each is used
bind-key -n -N "Key cheat sheet (tmux + i3)" M-/ display-popup -E -w 90% -h 85% "~/.local/bin/keys --tmux"

################################
# Plugins
# https://github.com/tmux-plugins/tpm
################################

set -g @plugin 'tmux-plugins/tpm'

# tmux-sessionx - fuzzy session/window/pane switcher (prefix + o)
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'

# tmux-resurrect - save/restore sessions across restarts
# Save: prefix + C-s   Restore: prefix + C-r
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
# Relaunch these on restore; Claude comes back with its last conversation
# in that pane's directory (nvim/vim/less/htop… are restored by default)
set -g @resurrect-processes '"claude->claude --continue" lazygit ipython'

# tmux-continuum - automatic save/restore
# restore 'on': the first tmux server start after a reboot restores the last save
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# tmux-yank - system clipboard integration
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_action 'copy-pipe-no-clear'
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'
set -g @override_copy_command 'DISPLAY=${DISPLAY:-:0} xclip -in -selection clipboard'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'

# Count key use for `keys stats` (after TPM so plugin keys are counted too)
run-shell -b '~/.local/bin/keys tmux-wrap'
