################################
# General
################################

set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g xterm-keys on
set -g mouse on

# Fix colors and improve escape time (important for vim/neovim)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,xterm-kitty:RGB"
set -s escape-time 10
set -g focus-events on
set -g display-time 2000
set -g detach-on-destroy off

# Visual activity monitoring
setw -g monitor-activity on
set -g visual-activity on

################################
# Prefix: Ctrl + a
################################

unbind C-b
set -g prefix C-a
bind C-a send-prefix

################################
# Reload config
################################

unbind r
bind r source-file ~/.tmux.conf \; display 'Reloaded tmux config.'

################################
# Session / window / pane management
################################

# New session
unbind n
unbind C-n
bind-key n new-session
bind-key C-n new-session

# New window
unbind t
unbind C-t
bind-key t new-window
bind-key C-t new-window

# Kill pane / session
unbind w
unbind C-w
bind-key w kill-pane
bind-key C-w kill-pane

unbind q
unbind C-q
bind-key q kill-session
bind-key C-q kill-session

# Splits: g = vertical (side by side), h = horizontal (top/bottom)
unbind g
unbind C-g
bind-key g split-window -h -c "#{pane_current_path}"
bind-key C-g split-window -h -c "#{pane_current_path}"

unbind h
unbind C-h
bind-key h split-window -v -c "#{pane_current_path}"
bind-key C-h split-window -v -c "#{pane_current_path}"

# Window navigation
unbind Pagedown
unbind Pageup
bind-key Pagedown next-window
bind-key Pageup previous-window

# Detach / paste
bind-key C-d detach-client
bind-key C-p paste-buffer

# Redraw client
bind R refresh-client

# Dev layout (pass current pane path so the layout opens in the right dir)
bind D run-shell "bash ~/.config/tmux_workspaces/dev_claude.sh '#{pane_current_path}'"

################################
# Pane navigation
################################

# Alt+h/j/k/l and Alt+arrows (no prefix) — seamless with nvim splits via
# vim-tmux-navigator: inside nvim the key is passed through, nvim moves between
# its splits and hands off to tmux at the edge. Alt (not Ctrl) keeps Ctrl+L/K/J
# working in shells and Claude.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n M-h     if-shell "$is_vim" 'send-keys M-h'     'select-pane -L'
bind -n M-j     if-shell "$is_vim" 'send-keys M-j'     'select-pane -D'
bind -n M-k     if-shell "$is_vim" 'send-keys M-k'     'select-pane -U'
bind -n M-l     if-shell "$is_vim" 'send-keys M-l'     'select-pane -R'
bind -n M-Left  if-shell "$is_vim" 'send-keys M-Left'  'select-pane -L'
bind -n M-Down  if-shell "$is_vim" 'send-keys M-Down'  'select-pane -D'
bind -n M-Up    if-shell "$is_vim" 'send-keys M-Up'    'select-pane -U'
bind -n M-Right if-shell "$is_vim" 'send-keys M-Right' 'select-pane -R'
bind -T copy-mode-vi M-h select-pane -L
bind -T copy-mode-vi M-j select-pane -D
bind -T copy-mode-vi M-k select-pane -U
bind -T copy-mode-vi M-l select-pane -R

# Pane navigation (prefix + jk for vertical, Left/Right for horizontal)
# Note: h is bound to horizontal split, so j/k/Left/Right are used here
bind-key j select-pane -D
bind-key k select-pane -U
bind-key Left  select-pane -L
bind-key Right select-pane -R

# Pane resizing (prefix + HJKL, repeatable)
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5

################################
# Copy mode (vi keys)
################################

setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y              send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi H   send -X start-of-line
bind -T copy-mode-vi L   send -X end-of-line

# Apps inside tmux (Claude Code, nvim) copy via OSC 52. gnome-terminal ignores
# OSC 52, so tmux accepts it and the hook forwards the buffer to the X clipboard.
set -g set-clipboard on
set-hook -g pane-set-clipboard 'run-shell -b "tmux save-buffer - | xclip -in -selection clipboard >/dev/null 2>&1"'

################################
# Status bar
################################

set -g status-position bottom
set -g status-interval 15            # clock only; pom pushes @pom itself
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa] "

set -g status-right-length 60
set -g status-right "#{@pom}#[fg=#a6e3a1] %Y-%m-%d #[fg=#cdd6f4]%H:%M "

set -g window-status-format         " #I:#W "
set -g window-status-current-format "#[bg=#313244,fg=#cdd6f4,bold] #I:#W#{?window_zoomed_flag,[Z],} "

set -g pane-border-style        "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

################################
# Scratch popup (no prefix needed)
################################

bind-key -n M-t display-popup -E "tmux new-session -A -s scratch"

# Quick tools in popups, opened in the current pane's directory
#   Alt+g       lazygit
#   prefix + f  fuzzy-pick a file → $EDITOR   (needs fzf)
#   prefix + e  file manager (vifm)
bind-key -n M-g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind-key f      display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "bash ~/.config/tmux/scripts/pick-edit.sh"
bind-key e      display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "vifm ."
# prefix + C  VimCommander (GUI) at the current pane's directory
bind-key C      run-shell -b "~/.local/bin/vimcommander '#{pane_current_path}' >/dev/null 2>&1"

# Pomodoro popup: one global timer (session "pom"), shown in status-right.
# Hide the popup with prefix C-d — the timer keeps running; q inside pom quits it.
bind-key P display-popup -E -w 64 -h 24 "tmux new-session -A -s pom 'python3 ~/.config/tmux_workspaces/pom.py'"

################################
# Plugins
# https://github.com/tmux-plugins/tpm
################################

set -g @plugin 'tmux-plugins/tpm'

# tmux-sessionx - fuzzy session/window/pane switcher (prefix + o)
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'

# tmux-resurrect - save/restore sessions across restarts
# Save: prefix + C-s   Restore: prefix + C-r
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
# Relaunch these on restore; Claude comes back with its last conversation
# in that pane's directory (nvim/vim/less/htop… are restored by default)
set -g @resurrect-processes '"claude->claude --continue" lazygit ipython'

# tmux-continuum - automatic save/restore
# restore 'on': the first tmux server start after a reboot restores the last save
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# tmux-yank - system clipboard integration
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_action 'copy-pipe-no-clear'
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
