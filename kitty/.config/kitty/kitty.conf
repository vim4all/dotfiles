# kitty — Catppuccin Mocha, matches i3 / tmux
# Reload config inside kitty: ctrl+shift+f5

# ── Font ──────────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
disable_ligatures cursor

# ── Window ────────────────────────────────────────────────────────────────────
window_padding_width 4
confirm_os_window_close 0
enable_audio_bell no
# Bell from Claude's notify hook → urgency hint → i3 marks the workspace red
window_alert_on_bell yes
# tmux does tabs/splits; keep kitty to a single window
tab_bar_style hidden
remember_window_size no

# ── Behaviour ─────────────────────────────────────────────────────────────────
scrollback_lines 10000
copy_on_select no
strip_trailing_spaces smart
# Apps (tmux, Claude, nvim) may write the clipboard via OSC 52
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
# Ctrl+click opens links (plain click is passed to tmux mouse mode)
mouse_map ctrl+left click ungrabbed,grabbed mouse_handle_click link
shell_integration enabled
update_check_interval 0

# ── Keys ──────────────────────────────────────────────────────────────────────
map ctrl+shift+c  copy_to_clipboard
map ctrl+shift+v  paste_from_clipboard
map ctrl+equal    change_font_size all +1.0
map ctrl+minus    change_font_size all -1.0
map ctrl+0        change_font_size all 0

# ── Transparency ──────────────────────────────────────────────────────────────
# Slightly see-through background, text stays solid. Needs picom (desktop :0;
# xrender backend, nothing new on the GPU side); without it (VNC :1) it's opaque.
# Ctrl+Shift+A, then 1 solid · D back to 0.93 · M / L more / less opaque
background_opacity         0.93
dynamic_background_opacity yes

