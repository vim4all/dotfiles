# picom — lean profile for i3 on an old dual-GPU ThinkPad
# (Intel HD 3000 + Quadro 2000M on nouveau, 3 monitors ≈ 8.4 MPx, reverse PRIME).
#
# Here picom's job is tear-free output and nothing more. With xrender every
# effect is CPU work over the whole damaged area of all 3 screens:
#   * opacity < 1  → every window alpha-blended with what's beneath it
#                     and can never be skipped/unredirected
#   * fading       → each focus change animates opacity = ~15 full repaints
#   * shadows/corners → extra per-window masks drawn in software
# All of that is off. The previous eye-candy config is in git history.

# ── Backend ───────────────────────────────────────────────────────────────────
backend = "xrender";
vsync = true;
experimental-backends = false;  # experimental path froze the screen (2026-11-02)
use-damage = true;              # repaint only changed regions
unredir-if-possible = true;     # fullscreen windows bypass the compositor
detect-transient = true;
detect-client-leader = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

# ── Effects (all off — see header) ────────────────────────────────────────────
shadow = false;
fading = false;
corner-radius = 0;
blur-background = false;

# ── Transparency ──────────────────────────────────────────────────────────────
# Everything opaque. To get a cheap "which window is focused" hint without
# blending, rely on the i3 border colour (mauve) instead.
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
