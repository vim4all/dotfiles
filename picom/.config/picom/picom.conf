# ── Backend ───────────────────────────────────────────────────────────────────
backend = "glx";
glx-no-stencil = true;
vsync = true;
experimental-backends = true;

# ── Shadows ───────────────────────────────────────────────────────────────────
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.6;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'i3bar'",
    "class_g = 'i3-frame'",
    "_GTK_FRAME_EXTENTS@:c"
];

# ── Fading ────────────────────────────────────────────────────────────────────
fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-delta = 5;
no-fading-openclose = true;

# ── Transparency ──────────────────────────────────────────────────────────────
inactive-opacity = 0.75;
active-opacity = 0.90;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
    "100:class_g = 'i3bar'",
    "100:class_g = 'rofi'",
    "100:class_g = 'dmenu'",
    "100:class_g = 'firefox'",
    "100:class_g = 'Zathura'"
];

# ── Blur ──────────────────────────────────────────────────────────────────────
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c"
];

# ── Corners ───────────────────────────────────────────────────────────────────
corner-radius = 8;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];
